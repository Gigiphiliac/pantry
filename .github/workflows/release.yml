name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 🔐 Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > ./release-keystore.jks
          # Fallback for local/PR builds: generate if secret missing
          if [ ! -s ./release-keystore.jks ]; then
            keytool -genkey -v \
              -keystore ./release-keystore.jks \
              -storepass pantry-release \
              -alias pantry-release-key \
              -keypass pantry-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=, O=, C="
          fi

      - name: 📦 Install dependencies
        run: make get

      - name: 🎨 Check formatting
        run: make format-check

      - name: 🔍 Analyze
        run: make analyze

      - name: 🧪 Run tests
        run: make test

      - name: 📱 Build release APK
        run: make build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Changes

            <!-- Summarise changes in this release -->
          files: |
            build/app/outputs/flutter-apk/pantry-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true