name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 Install dependencies
        run: make get

      - name: 🎨 Check formatting
        run: make format-check

      - name: 🔍 Analyze
        run: make analyze

      - name: 🧪 Run tests
        run: make test